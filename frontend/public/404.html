<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>VisualAI - Multimodal Scene Understanding System</title>
    <meta name="description" content="Upload an image, let AI detect objects, analyze the scene context, and generate human-readable explanations — all in real-time." >
    <meta name="keywords" content="AI, computer vision, scene understanding, object detection, image analysis, machine learning" >
    <meta name="author" content="VisualAI" >
    <link rel="icon" type="image/png" href="/top.png" >
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        background-color: #0f0f1a;
        color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .redirect-container {
        text-align: center;
        padding: 2rem;
      }
      .redirect-message {
        font-size: 1.2rem;
        margin-bottom: 1rem;
      }
      .redirect-link {
        color: #22d3ee;
        text-decoration: none;
        font-weight: bold;
      }
      .redirect-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="redirect-container">
      <div class="redirect-message">Redirecting to the main application...</div>
      <a href="/" class="redirect-link">Click here if you're not redirected automatically</a>
    </div>
    <script>
      // Redirect to the main application
      setTimeout(function() {
        window.location.href = "/";
      }, 1000);
    </script>
  </body>
</html>
